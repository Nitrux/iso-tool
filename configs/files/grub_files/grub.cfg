set gfxmode=auto
insmod efi_gop
insmod efi_uga
insmod gfxterm
terminal_output gfxterm
loadfont /boot/grub/themes/nitrux/dejavu_sans_mono_bold.pf2

set theme=/boot/grub/themes/nitrux/theme.txt

menuentry "Boot Nitrux (Live)" {
    set gfxpayload=keep
    linux /boot/kernel boot=casper username=nitrux hostname=live iso-scan/filename=$iso_path noprompt quiet splash
    initrd /boot/initramfs
}

menuentry "Boot Nitrux (Live) [Other Boot Options]" {
    submenu "Boot Nitrux (Live) loglevel no-splash mode" {
        set gfxpayload=keep
        linux /boot/kernel boot=casper username=nitrux hostname=live iso-scan/filename=$iso_path loglevel=7 noprompt
        initrd /boot/initramfs
    }
    submenu "Boot Nitrux (Live) nomodeset console mode" {
        set gfxpayload=keep
        linux /boot/kernel boot=casper username=nitrux hostname=live iso-scan/filename=$iso_path nomodeset noprompt
        initrd /boot/initramfs
    }
}
