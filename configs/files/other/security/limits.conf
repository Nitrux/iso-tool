# /etc/security/limits.conf
# Nitrux Performance & Security Tuning
# 2025 (c) Nitrux Latinoamericana S.C.

# This file sets the resource limits for the users logged in via PAM.
# It does not affect resource limits of the system services.

# <domain>      <type>  <item>         <value>

# -----------------------------------------------------------------------------
# 1. GAMING & HEAVY WORKLOADS (Wine/Proton/Compile)
# -----------------------------------------------------------------------------
# Default is 1024. Modern Windows games (Esync/Fsync) need significantly more.
# 524288 is the "sweet spot" for compatibility without exhaustion.
* hard    nofile         524288
* soft    nofile         524288
root            hard    nofile         524288
root            soft    nofile         524288

# -----------------------------------------------------------------------------
# 2. LOW LATENCY AUDIO (PipeWire/JACK)
# -----------------------------------------------------------------------------
# Grants realtime priority and memory locking to the audio group.
# Essential for glitch-free audio in games and pro-audio apps.
@audio          -       rtprio         95
@audio          -       memlock        unlimited

# -----------------------------------------------------------------------------
# 3. SYSTEM STABILITY (Anti-Fork-Bomb)
# -----------------------------------------------------------------------------
# Cap the number of processes per user to 30,000.
# This prevents a malicious script or bug from freezing the kernel,
# while still allowing heavy parallel compilation (make -j16).
# Root is exempt so you can always SSH in to kill a rogue process.
* hard    nproc          30000
root            hard    nproc          unlimited

# -----------------------------------------------------------------------------
# 4. CORE DUMPS (Debugging vs Space)
# -----------------------------------------------------------------------------
# Soft limit 0: By default, don't generate core dumps (save disk space).
# Hard limit unlimited: Allows a user to run 'ulimit -c unlimited' in a shell
# if they *need* to capture a crash dump for debugging Hyprland/Mesa.
* soft    core           0
* hard    core           unlimited

# End of file
